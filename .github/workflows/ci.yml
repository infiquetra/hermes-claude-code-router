name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Defensive: no untrusted GitHub event inputs are used in `run:` commands anywhere in this file.
# Only checkout, dependency install, and our own test/lint commands run here.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check dependency lockfile
        run: test -f uv.lock

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
          # v5 omits uv from its key; retain runtime and declared Python policy.
          cache-suffix: uv-0.13.6-python-3.12
          cache-local-path: ${{ runner.temp }}/uv-cache
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint with ruff
        run: uv run ruff check plugins/hermes_claude_code_router/tests/ plugins/hermes_claude_code_router/

      - name: Type-check with mypy
        run: uv run mypy plugins/

      - name: Run pytest
        run: uv run pytest plugins/hermes_claude_code_router/tests/ -v
