name: Redis compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/redis-compatibility.yml
      - plugins/hermes_claude_code_router/**
      - pyproject.toml
      - uv.lock
  push:
    branches: [main]
    paths:
      - .github/workflows/redis-compatibility.yml
      - plugins/hermes_claude_code_router/**
      - pyproject.toml
      - uv.lock
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  redis-compatibility:
    name: Real Redis stream compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      redis:
        # Redis 7.4.12; immutable official Docker Library index.
        image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check dependency lockfile
        run: test -f uv.lock

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
          # v5 omits uv from its key; retain runtime and declared Python policy.
          cache-suffix: uv-0.13.6-python-3.12
          cache-local-path: ${{ runner.temp }}/uv-cache
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Round-trip a protocol message through real Redis
        env:
          REDIS_TEST_PORT: ${{ job.services.redis.ports['6379'] }}
        run: >-
          timeout 30s uv run python -m
          plugins.hermes_claude_code_router.compatibility.redis_roundtrip
          --port "$REDIS_TEST_PORT"
